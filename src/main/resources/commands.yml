# This configuration file allows you to execute commands on various parkour events.
# Supported placeholders in commands:
#   %p is replaced with the player name.
#   %nick is replaced with the player's nickname.
#   %id is replaced with the id of the parkour run the player was in.
#   %name is replaced with the name of the parkour run the player was in.
#
# For example, if you want to broadcast when a player finishes a parkour run:
# onParkourEnd:
#   broadcast:
#     command: 'broadcast %p has just finished the parkour %name!'
#     executor: CONSOLE
#
# Each command under an event has a name you can choose freely (e.g. 'broadcast' as above),
# followed by a mandatory 'command' field and an 'executor' field (either PLAYER or CONSOLE).
# You can define multiple commands under the same event.
#
# You can also add a delay to a command. It will run after the specified ticks
# (20 ticks = 1 second). Example:
# onParkourEnd:
#   congratulate:
#     command: 'msg %p Nice run!'
#     executor: PLAYER
#     delay: 200
#
# You can also specify a parkour id using the 'id' field.
# Delete the line to target all parkour runs.
#
# Supported command events:
#   onParkourStart - runs when a player starts a parkour run
#   onParkourEnd   - runs when a player successfully completes a parkour run
#   onParkourExit  - runs when a player leaves or cancels a parkour run before finishing

